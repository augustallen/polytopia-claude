[project]
name = "polytopia-bridge"
version = "0.1.0"
description = "Drive The Battle of Polytopia through the ClaudeBridge mod and let Claude play it."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polytopia_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
